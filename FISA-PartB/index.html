<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Retail Order & Delivery Support Portal</title>
</head>
<body>
    <h2>Order Form</h2>
    <form id="bookingForm">
        <p>
            Name: <input type="text" id="customerName" placeholder="Brandon De Wet">
        </p>

        <p>
            Product:
            <select id="productName">
                <option value="" selected disabled>Please Select a Product</option>
                <option value="Chair">Chair</option>
                <option value="Desk">Desk</option>
                <option value="Table">Table</option>
            </select>
        </p>

        <p>
            Quantity: <input type="number" id="quantity">
        </p>

        <p>
            Unit Price: <input type="number" id="price">
        </p>

        <p>
            <input type="checkbox" id="isMember"> Are you a member
        </p>

        <p>
            <input type="checkbox" id="isDelivered"> Delivery Required
        </p>
        <button type="submit">Submit</button>
    </form>

    <div id="validationError" style="color: red; display: none"></div>

    <div id="outputArea">
        <h3>Booking Details:</h3>
        <p id="outName"></p>
        <p id="outProduct"></p>
        <p id="outQuantity"></p>
        <p id="outPrice"></p>
        <p id="outMember"></p>
        <p id="outDelivered"></p>
        <p id="outSubtotal"></p>
        <p id="outMemberDiscountTotal"></p>
    </div>

    <hr>
    <div>
        <h3>Booking Records</h3>
        <label for="statusFilter">Filter by Status:</label>
        <select id="statusFilter">
            <option value="ALL">ALL Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Completed">Completed</option>
            <option value="Delivered">Delivered</option>
        </select>
        <ul id="recordList"></ul>
    </div>

<script src="script.js"></script>
</body>
</html>
