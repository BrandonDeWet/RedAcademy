<!DOCTYPE html>
<html>
<head>
    <title>Booking Form</title>
    <!-- Correctly linking the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Service Booking</h2>

    <!-- The Form -->
    <form id="bookingForm">
        <!-- 1. Customer Name -->
        <p>
            Name: <input type="text" id="customerName" placeholder="Brandon De Wet">
        </p>

        <!-- 2. Service Type -->
        <p>
            Service:
            <select id="serviceType">
                <option value="" selected disabled>Please Select a Service</option>
                <option value="Consulting">Consulting</option>
                <option value="Design">Design</option>
            </select>
        </p>

        <!-- 3. Number of Hours -->
        <p>
            Hours: <input type="number" id="hours">
        </p>

        <!-- 4. Urgent Status -->
        <p>
            <input type="checkbox" id="isUrgent"> Is this urgent?
        </p>

        <button type="submit">Submit</button>
    </form>

    <div id="validationError" style="color: red; display: none;"></div>

    <!-- 5. Result/Output Area with dedicated elements for textContent -->
    <div id="outputArea">
        <h3>Booking Details:</h3>
        <p id="outName"></p>
        <p id="outService"></p>
        <p id="outHours"></p>
        <p id="outUrgent"></p>
        <p id="outCost"></p>
    </div>
<!--  B5 filter list  -->
    <hr>
    <div>
        <h3>Booking Records</h3>
        <label for="statusFilter">Filter by Status:</label>
        <select id="statusFilter">
            <option value="ALL">ALL Statuses</option>
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Completed">Completed</option>
        </select>
        <ul id="recordList"></ul>
    </div>
    <!-- Correctly linking the JS file -->
    <script src="script.js"></script>
</body>
</html>
